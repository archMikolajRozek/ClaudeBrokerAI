version: '3.8'

services:
  # Redis - Message broker
  redis:
    image: redis:7-alpine
    container_name: ai-portfolio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL - Database for historical data, positions, orders
  postgres:
    image: postgres:15-alpine
    container_name: ai-portfolio-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Agent: Ingest News
  agent-ingest-news:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.agent
    container_name: agent-ingest-news
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_NAME=ingest_news
    volumes:
      - ./agents/ingest_news:/app/agent
      - ./packages/common:/app/packages/common
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Agent: Score News
  agent-score-news:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.agent
    container_name: agent-score-news
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_NAME=score_news
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./agents/score_news:/app/agent
      - ./packages/common:/app/packages/common
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Agent: Market Data (WYŁĄCZONY - Polygon wymaga $99/mo, używamy Finazon)
  # agent-market-data:
  #   build:
  #     context: .
  #     dockerfile: ./infra/Dockerfile.agent
  #   container_name: agent-market-data
  #   environment:
  #     - REDIS_URL=redis://redis:6379
  #     - AGENT_NAME=market_data
  #     - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
  #     - POLYGON_API_KEY=${POLYGON_API_KEY}
  #   volumes:
  #     - ./agents/market_data:/app/agent
  #     - ./packages/common:/app/packages/common
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped

  # Agent: Strategy
  agent-strategy:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.agent
    container_name: agent-strategy
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_NAME=strategy
    volumes:
      - ./agents/strategy:/app/agent
      - ./packages/common:/app/packages/common
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Agent: Risk
  agent-risk:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.agent
    container_name: agent-risk
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_NAME=risk
      - MAX_POSITION_SIZE=${MAX_POSITION_SIZE:-10000}
      - MAX_PORTFOLIO_RISK=${MAX_PORTFOLIO_RISK:-0.02}
    volumes:
      - ./agents/risk:/app/agent
      - ./packages/common:/app/packages/common
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # IB Gateway - Interactive Brokers API Gateway (Paper Trading)
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: ib-gateway
    environment:
      - TRADING_MODE=paper  # paper or live
      - TWS_USERID=${IBKR_USERNAME}  # Your IBKR username
      - TWS_PASSWORD=${IBKR_PASSWORD}  # Your IBKR password
      - TWS_ACCEPT_INCOMING=accept  # Automatically accept API connections (default: manual)
      - TWOFA_TIMEOUT_ACTION=restart  # Restart on 2FA timeout (paper trading doesn't need 2FA)
      - VNC_SERVER_PASSWORD=  # No VNC password (optional monitoring)
      - READ_ONLY_API=no  # Enable full API access (not read-only)
    ports:
      - "127.0.0.1:4002:4002"  # Paper trading port
      - "127.0.0.1:5900:5900"  # VNC (optional, for monitoring)
    restart: unless-stopped
    # Note: socat relay allows Docker network connections to reach IB Gateway (which only trusts 127.0.0.1)
    # TWS_ACCEPT_INCOMING=accept configures IBC to automatically accept incoming API connections

  # Agent: Execution (IBKR) - PRIMARY
  agent-execution:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.agent
    container_name: agent-execution-ibkr
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_NAME=execution_ibkr
      - IBKR_HOST=${IBKR_HOST:-ib-gateway}
      - IBKR_PORT=${IBKR_PORT:-4002}
      - IBKR_CLIENT_ID=${IBKR_CLIENT_ID:-1}
    volumes:
      - ./agents/execution_ibkr:/app/agent
      - ./packages/common:/app/packages/common
    depends_on:
      redis:
        condition: service_healthy
      ib-gateway:
        condition: service_started
    restart: unless-stopped

  # Agent: Execution (Alpaca) - BACKUP (uncomment to use)
  # agent-execution-alpaca:
  #   build:
  #     context: .
  #     dockerfile: ./infra/Dockerfile.agent
  #   container_name: agent-execution-alpaca
  #   environment:
  #     - REDIS_URL=redis://redis:6379
  #     - AGENT_NAME=execution_alpaca
  #     - ALPACA_API_KEY=${ALPACA_API_KEY}
  #     - ALPACA_API_SECRET=${ALPACA_API_SECRET}
  #     - ALPACA_BASE_URL=${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
  #   volumes:
  #     - ./agents/execution_alpaca:/app/agent
  #     - ./packages/common:/app/packages/common
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped

  # Agent: Shock Detector
  agent-shock-detector:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.agent
    container_name: agent-shock-detector
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_NAME=shock_detector
    volumes:
      - ./agents/shock_detector:/app/agent
      - ./packages/common:/app/packages/common
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Agent: Momentum (NOWY - technical indicators)
  agent-momentum:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.agent
    container_name: agent-momentum
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_NAME=momentum
      - MOMENTUM_WINDOW_SIZE=${MOMENTUM_WINDOW_SIZE:-50}
      - MOMENTUM_RSI_PERIOD=${MOMENTUM_RSI_PERIOD:-14}
      - MOMENTUM_MACD_FAST=${MOMENTUM_MACD_FAST:-12}
      - MOMENTUM_MACD_SLOW=${MOMENTUM_MACD_SLOW:-26}
      - MOMENTUM_MACD_SIGNAL=${MOMENTUM_MACD_SIGNAL:-9}
    volumes:
      - ./agents/momentum:/app/agent
      - ./packages/common:/app/packages/common
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Agent: Market Data Finazon (TESTOWY - trial API)
  agent-market-data-finazon:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.agent
    container_name: agent-market-data-finazon
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_NAME=market_data_finazon
      - FINAZON_API_KEY=${FINAZON_API_KEY}
      - WATCHLIST=${WATCHLIST:-AAPL,TSLA,GOOG}
      - MARKET_DATA_UPDATE_INTERVAL=${MARKET_DATA_UPDATE_INTERVAL:-60}
    volumes:
      - ./agents/market_data_finazon:/app/agent
      - ./packages/common:/app/packages/common
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Agent: Circuit Breaker (Emergency Stop - Last Line of Defense)
  agent-circuit-breaker:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.agent
    container_name: agent-circuit-breaker
    environment:
      - REDIS_URL=redis://redis:6379
      - AGENT_NAME=circuit_breaker
      - RISK_NAV=${RISK_NAV:-50000.0}
      - RISK_DAILY_LOSS_PCT=${RISK_DAILY_LOSS_PCT:-0.02}
      - CIRCUIT_BREAKER_MAX_DRAWDOWN=${CIRCUIT_BREAKER_MAX_DRAWDOWN:-0.10}
    volumes:
      - ./agents/circuit_breaker:/app/agent
      - ./packages/common:/app/packages/common
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # API
  api:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.api
    container_name: ai-portfolio-api
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-portfolio_db}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./packages/common:/app/packages/common
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # UI - Streamlit Dashboard
  ui:
    image: python:3.11-slim
    container_name: ai-portfolio-ui
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt &&
               streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0"
    environment:
      - REDIS_URL=redis://redis:6379
      - RISK_NAV=${RISK_NAV:-50000.0}
    ports:
      - "8501:8501"
    volumes:
      - ./apps/ui:/app
      - ./packages/common:/app/packages/common
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
